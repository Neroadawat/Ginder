name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]" pip-audit
      - run: python -m ruff check .
      - run: python -m mypy app --no-error-summary
      - run: python -m pytest -q
      - run: pip-audit . --progress-spinner off

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --runInBand
      - run: node --test ../backend/tests/admin_ui_helpers.test.cjs
      - run: npm audit --omit=dev --audit-level=high

  admin-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ginder_admin_check
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ginder_admin_check_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ginder_admin_check -d ginder_admin_check_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://ginder_admin_check:ci-only-password@127.0.0.1:5432/ginder_admin_check_ci
      ADMIN_TEST_POSTGRES_URL: postgresql+asyncpg://ginder_admin_check:ci-only-password@127.0.0.1:5432/ginder_admin_check_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m alembic upgrade head
      - run: python -m pytest tests/test_restaurant_admin.py -q
      - run: python -m alembic downgrade 0006
      - run: python -m alembic upgrade head

  android-release-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: npm ci
      - run: cp .env.production.example .env.production
      - run: chmod +x android/gradlew
      - run: ./gradlew bundleRelease --no-daemon
        working-directory: frontend/android
