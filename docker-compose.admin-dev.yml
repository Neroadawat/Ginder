# Isolated local infrastructure: no production env file, ports or volumes.
name: ginder-admin-dev
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ginder_admin_dev
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: ginder_admin_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - admin_dev_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ginder_admin_dev -d ginder_admin_dev"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
volumes:
  admin_dev_postgres:
